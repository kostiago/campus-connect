<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Campus Connect</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login-page.css">
</head>
<body>

  <main class="login-page">
    <div class="login-panel-form">
      <a href="../index.html" class="login-logo">
        <span class="logo-icon" aria-hidden="true">🎓</span>
        <span>Campus <span class="logo-highlight">Connect</span></span>
      </a>

      <div class="login-form-wrapper">
        <div class="login-form-header">
          <h1>Entrar</h1>
          <a href="register.html" class="login-signup-link">Criar conta</a>
        </div>

        <form class="login-form" id="login-form" novalidate>
          <div class="form-group">
            <input
              type="text"
              id="login-identifier"
              name="identifier"
              placeholder="E-mail institucional"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group password-group">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Senha"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Mostrar senha">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 4.2-5.2M9.9 4.2A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a19.6 19.6 0 0 1-2.3 3.3"/>
                <path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn-login-submit" id="login-submit" disabled>
            Entrar
          </button>

          <p class="login-feedback" id="login-feedback"></p>

          <a href="#" class="forgot-password-link">Esqueceu sua senha? <strong>Clique aqui</strong></a>

          <div class="login-divider">
            <span>ou entre com</span>
          </div>

          <div class="social-login-buttons">
            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google
            </button>

            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
                <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
                <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
                <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
              </svg>
              Microsoft
            </button>
          </div>
        </form>
      </div>

      <p class="login-copyright">© 2026 Campus Connect. Todos os direitos reservados.</p>
    </div>

    <div class="login-panel-visual">
      <div class="login-visual-card">
        <div class="login-visual-overlay">
          <h2>Comece sua jornada acadêmica com um clique, explore o que a universidade tem a oferecer!</h2>
        </div>

        <!-- Substitua pela imagem real quando disponível -->
        <img src="../img/hero-image.png" alt="Estudantes participando de um evento no campus" class="login-visual-image">

        <div class="login-visual-dots" aria-hidden="true">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/pages/auth/login.js"></script>
</body>
</html>
