<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header-user-menu.css">
    <link rel="stylesheet" href="../css/contact-page.css">
    <link rel="stylesheet" href="../css/components/button.css">
</head>

<body>

    <site-header current="contato"></site-header>

    <main class="contact-page">
        <div class="contact-page-header">
            <h1>Fale Conosco</h1>
            <p>Alguma dúvida ou sugestão? Envie sua mensagem!</p>
        </div>

        <div class="contact-card">
            <div class="contact-info-panel">
                <div class="contact-info-content">
                    <h2>Informações de Contato</h2>
                    <p>Fale com a gente, estamos por aqui para ajudar.</p>

                    <div class="contact-info-list">
                        <div class="contact-info-item">
                            <span class="contact-info-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z" />
                                </svg>
                            </span>
                            <span>(83) 3421-0000</span>
                        </div>

                        <div class="contact-info-item">
                            <span class="contact-info-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 7l9 6 9-6M3 7v10h18V7" />
                                </svg>
                            </span>
                            <span>contato@campusconnect.edu.br</span>
                        </div>

                        <div class="contact-info-item">
                            <span class="contact-info-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" />
                                    <circle cx="12" cy="10" r="2.5" />
                                </svg>
                            </span>
                            <span>Bloco de Engenharia, Campus Central, João Pessoa - PB</span>
                        </div>
                    </div>
                </div>

                <div class="contact-decor" aria-hidden="true"></div>

                <div class="contact-social-icons">
                    <a href="#" aria-label="Instagram" class="contact-social-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                        </svg>
                    </a>
                    <a href="#" aria-label="LinkedIn" class="contact-social-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="3" />
                            <path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4M11 13v4" />
                        </svg>
                    </a>
                    <a href="#" aria-label="YouTube" class="contact-social-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="4" />
                            <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none" />
                        </svg>
                    </a>
                </div>
            </div>

            <form class="contact-form" id="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="contact-first-name">Nome</label>
                        <input type="text" id="contact-first-name" name="firstName" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-last-name">Sobrenome</label>
                        <input type="text" id="contact-last-name" name="lastName" placeholder="Seu sobrenome" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="contact-email">E-mail</label>
                        <input type="email" id="contact-email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-phone">Telefone</label>
                        <input type="tel" id="contact-phone" name="phone" placeholder="(83) 90000-0000">
                    </div>
                </div>

                <fieldset class="form-group subject-group">
                    <legend>Selecione o Assunto</legend>
                    <div class="subject-options">
                        <label class="subject-radio">
                            <input type="radio" name="subject" value="duvida" checked>
                            <span class="radio-dot"></span>
                            Dúvida Geral
                        </label>
                        <label class="subject-radio">
                            <input type="radio" name="subject" value="parceria">
                            <span class="radio-dot"></span>
                            Parceria
                        </label>
                        <label class="subject-radio">
                            <input type="radio" name="subject" value="suporte">
                            <span class="radio-dot"></span>
                            Suporte Técnico
                        </label>
                        <label class="subject-radio">
                            <input type="radio" name="subject" value="outro">
                            <span class="radio-dot"></span>
                            Outro
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="contact-message">Mensagem</label>
                    <textarea id="contact-message" name="message" placeholder="Escreva sua mensagem..." rows="1"
                        required></textarea>
                </div>

                <div class="form-footer">
                    <svg class="paper-plane-decor" viewBox="0 0 100 60" aria-hidden="true">
                        <path d="M5 45 Q 25 20, 45 40 T 80 15" fill="none" stroke="var(--color-border)"
                            stroke-width="1.5" stroke-dasharray="4 5" />
                        <g transform="translate(78, 5) rotate(20)">
                            <path d="M0 12L20 0L14 18L9 13L0 12Z" fill="var(--color-primary)" />
                        </g>
                    </svg>

                    <button type="submit" class="btn-send">Enviar Mensagem</button>

                </div>

                <p class="form-feedback" id="contact-form-feedback"></p>
            </form>
        </div>
    </main>
    <site-footer></site-footer>

    <script src="../js/auth.js"></script>
    <script src="../js/components/header-site.js"></script>
    <script src="../js/components/site-footer.js"></script>
    <script src="../js/pages/contact/contact-page.js"></script>
</body>

</html>
